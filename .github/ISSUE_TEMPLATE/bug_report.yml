name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please remove tokens, passwords and other secrets from anything you paste.
        Security problems go through private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: opsmender-version
    attributes:
      label: OpsMender version
      description: Shown at the bottom of the sidebar.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: coolify-version
    attributes:
      label: Coolify version
      placeholder: "4.0.0-beta.xxx"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Coolify sync / resources
        - Deployments
        - Server metrics / probe
        - Incidents / rules
        - AI diagnosis
        - Actions
        - UI
        - Install / Docker
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: OpsMender container logs around the problem (secrets removed).
      render: shell
