[project]
name = "opsmender"
version = "0.1.0"
description = "Open-source, lightweight AI DevOps companion for Coolify"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "asyncssh>=2.17",
    "cryptography>=43",
    "psutil>=6.0",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
opsmender = "opsmender.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opsmender*"]

[tool.setuptools.package-data]
opsmender = ["web/templates/*.html", "web/static/*", "metrics/probe.sh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
